    <script>
      (function () {
        var locales = { en: 1, fr: 1, de: 1, nl: 1, da: 1, sv: 1, es: 1, it: 1, pt: 1, ro: 1 };
        var root = document.documentElement;
        try {
          var savedTheme = localStorage.getItem('theme');
          var theme =
            savedTheme === 'light' || savedTheme === 'dark'
              ? savedTheme
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          root.classList.add(theme === 'dark' ? 'theme-dark' : 'theme-light');
          root.setAttribute('data-theme', theme);
          root.style.colorScheme = theme;

          var savedLocale = localStorage.getItem('locale');
          var locale = savedLocale && locales[savedLocale] ? savedLocale : null;
          if (!locale) {
            var langs = navigator.languages && navigator.languages.length
              ? navigator.languages
              : [navigator.language];
            for (var i = 0; i < langs.length; i++) {
              var code = String(langs[i] || '').toLowerCase().slice(0, 2);
              if (locales[code]) {
                locale = code;
                break;
              }
            }
          }
          root.lang = locale || 'en';
        } catch (e) {
          root.classList.add('theme-light');
          root.style.colorScheme = 'light';
          root.lang = 'en';
        }
      })();
